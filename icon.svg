<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" rx="110" fill="#070707"/>
  <!-- Dot matrix background pattern -->
  <defs>
    <pattern id="dotGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="2.5" fill="#1c1c1c"/>
    </pattern>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#dotGrid)"/>
  
  <!-- Outer circular border -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#252525" stroke-width="6" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="140" fill="#101010" stroke="#333333" stroke-width="4"/>

  <!-- Turntable / Dot Spindle -->
  <circle cx="256" cy="256" r="70" fill="#161616" stroke="#444444" stroke-width="2"/>
  <circle cx="256" cy="256" r="26" fill="#e52b2b"/>
  <circle cx="256" cy="256" r="8" fill="#ffffff"/>

  <!-- Equalizer Dots -->
  <circle cx="256" cy="76" r="10" fill="#e52b2b"/>
  <circle cx="286" cy="84" r="8" fill="#f0f0f0"/>
  <circle cx="226" cy="84" r="8" fill="#f0f0f0"/>
  <circle cx="314" cy="100" r="6" fill="#666666"/>
  <circle cx="198" cy="100" r="6" fill="#666666"/>

  <!-- Nothing OS text -->
  <text x="256" y="440" font-family="Courier New, monospace" font-size="28" font-weight="bold" fill="#f0f0f0" text-anchor="middle" letter-spacing="8">DOT (PLAYER)</text>
</svg>
